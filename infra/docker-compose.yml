services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nfw-db
    environment:
      POSTGRES_USER: nfw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nfw_dev_password}
      POSTGRES_DB: nfw
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nfw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfw -d nfw"]
      interval: 5s
      timeout: 3s
      retries: 10


  api:
    build:
      context: ../backend
    container_name: nfw-api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

      
volumes:
  nfw_pgdata:
