services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nfw-db
    environment:
      POSTGRES_USER: nfw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nfw_dev_password}
      POSTGRES_DB: nfw
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nfw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfw -d nfw"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nfw_pgdata:
